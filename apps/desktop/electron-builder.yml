appId: icu.enduragent.desktop
productName: Enduragent
asar: true
asarUnpack:
  - dist/self-test-asar/native/keychain-binding.node
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
electronLanguages:
  - en-US
directories:
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
  - "!**/.env*"
  - "!**/{test,tests,__tests__,fixture,fixtures,dev-fixture,dev-fixtures}/**"
  - "!**/*.{test,spec}.{js,cjs,mjs,ts,cts,mts,jsx,tsx}"
  - "!**/vitest.config.{js,cjs,mjs,ts,cts,mts}"
  - "!**/vitest.workspace.{js,cjs,mjs,ts,cts,mts}"
  - "!**/node_modules/vitest/**"
  - "!**/node_modules/@vitest/**"
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*"
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - from: resources
    to: resources
    filter:
      - trayTemplate.png
      - trayTemplate@2x.png
  - from: dist/self-test-asar
    to: .
extraResources:
  - from: dist/extra-resources
    to: .
mac:
  icon: resources/app-icon.png
  # Squirrel.Mac otherwise accepts older builds that remain validly signed.
  extendInfo:
    ElectronSquirrelPreventDowngrades: true
  target:
    - target: dir
      arch: [arm64]
win:
  icon: resources/app-icon.ico
  signExecutable: false
  requestedExecutionLevel: asInvoker
  files:
    - resources/tray.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: Enduragent-${version}-x64.${ext}
  guid: 80611707-2ddf-50e5-b3ec-95f38ab4a6fa
  oneClick: true
  perMachine: false
  packElevateHelper: false
  createStartMenuShortcut: true
  createDesktopShortcut: false
  deleteAppDataOnUninstall: false
  installerLanguages:
    - en_US
  language: "1033"
  multiLanguageInstaller: false
  displayLanguageSelector: false
  differentialPackage: false
  buildUniversalInstaller: false
  include: build/installer.nsh
