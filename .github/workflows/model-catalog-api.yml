name: Model catalog API

on:
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  deploy:
    environment: model-catalog-${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @enduragent/coach-contract build
      - name: Deploy the API fallback
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ runner.temp }}
          command: deploy --env ${{ inputs.target }} --config ${{ github.workspace }}/tools/model-catalog-api-fallback.wrangler.toml
      - name: Deploy the model catalog route
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ runner.temp }}
          command: deploy --env ${{ inputs.target }} --config ${{ github.workspace }}/tools/model-catalog.wrangler.toml
      - name: Verify the deployed API
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" = "production" ]; then
            origin=https://api.enduragent.icu
          else
            origin=https://api-staging.enduragent.icu
          fi
          pnpm models:verify-service "$origin"
