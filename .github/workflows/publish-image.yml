name: Publish Docker image

# First run creates each GHCR package, private by default. Before publishing the
# Railway marketplace template, confirm the visibility of BOTH packages named in
# the env block below is Public in GitHub Packages — a private package answers
# `docker pull` with 401 for everyone.

# The bot image and the desktop shell share one branch. Desktop-only surfaces
# are excluded rather than bot-relevant ones allowlisted, so a new package in
# the cycling-coach workspace closure keeps publishing instead of silently
# dropping out of the release path.
on:
  push:
    branches: [main]
    tags:
      - 'cycling-coach@*'
    paths-ignore:
      - 'apps/desktop/**'
      - 'apps/desktop-renderer/**'
      - 'packages/desktop-*/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/yerzhansa/cycling-coach
  ALIAS_IMAGE_NAME: ghcr.io/yerzhansa/enduragent

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: docker.io/tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Derive image tags
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::12}"
          version=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == cycling-coach@* ]]; then
            version="${GITHUB_REF_NAME#cycling-coach@}"
          fi

          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:main-${short_sha}"
            if [[ -n "$version" ]]; then
              echo "${IMAGE_NAME}:${version}"
            fi
            echo "${ALIAS_IMAGE_NAME}:main-${short_sha}"
            if [[ -n "$version" ]]; then
              echo "${ALIAS_IMAGE_NAME}:${version}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.title=Cycling Coach"
            echo "org.opencontainers.image.description=Single-tenant AI cycling coach for Telegram and intervals.icu"
            echo "org.opencontainers.image.source=https://github.com/yerzhansa/enduragent"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            if [[ -n "$version" ]]; then
              echo "org.opencontainers.image.version=${version}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/cycling-coach/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cycling-coach
          cache-to: type=gha,mode=max,scope=cycling-coach
