name: Publish Docker image

# First run creates each GHCR package, private by default. Before publishing the
# Railway marketplace template, confirm the visibility of BOTH packages named in
# the env block below is Public in GitHub Packages — a private package answers
# `docker pull` with 401 for everyone.

# The bot image and the desktop shell share one branch. Desktop-only surfaces
# are excluded rather than bot-relevant ones allowlisted, so a new package in
# the cycling-coach workspace closure keeps publishing instead of silently
# dropping out of the release path.
on:
  push:
    branches: [main]
    tags:
      - 'cycling-coach@*'
    paths-ignore:
      - 'apps/desktop/**'
      - 'apps/desktop-renderer/**'
      - 'packages/desktop-*/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/yerzhansa/cycling-coach
  ALIAS_IMAGE_NAME: ghcr.io/yerzhansa/enduragent

jobs:
  prepare-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      catalog_release_group_id: ${{ steps.pin.outputs.catalog_release_group_id }}
      catalog_revision: ${{ steps.pin.outputs.catalog_revision }}
      catalog_digest: ${{ steps.pin.outputs.catalog_digest }}
      now_iso: ${{ steps.pin.outputs.now_iso }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare catalog pin
        id: pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOW_ISO=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          test -n "$NOW_ISO"
          echo "now_iso=$NOW_ISO" >> "$GITHUB_OUTPUT"
          pnpm --silent models:release-pin prepare --source-commit "$GITHUB_SHA" --now-iso "$NOW_ISO"

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare-catalog
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Materialize release catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOW_ISO: ${{ needs.prepare-catalog.outputs.now_iso }}
        run: |
          set -euo pipefail
          test -n "$NOW_ISO"
          pnpm --silent models:release-pin read --source-commit "$GITHUB_SHA" --now-iso "$NOW_ISO"
          pnpm --silent models:release-pin materialize --source-commit "$GITHUB_SHA" --now-iso "$NOW_ISO" --workspace "$GITHUB_WORKSPACE"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Derive image tags
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::12}"
          version=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == cycling-coach@* ]]; then
            version="${GITHUB_REF_NAME#cycling-coach@}"
          fi

          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:main-${short_sha}"
            if [[ -n "$version" ]]; then
              echo "${IMAGE_NAME}:${version}"
            fi
            echo "${ALIAS_IMAGE_NAME}:main-${short_sha}"
            if [[ -n "$version" ]]; then
              echo "${ALIAS_IMAGE_NAME}:${version}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.title=Cycling Coach"
            echo "org.opencontainers.image.description=Single-tenant AI cycling coach for Telegram and intervals.icu"
            echo "org.opencontainers.image.source=https://github.com/yerzhansa/enduragent"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            if [[ -n "$version" ]]; then
              echo "org.opencontainers.image.version=${version}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/cycling-coach/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cycling-coach
          cache-to: type=gha,mode=max,scope=cycling-coach

      - name: Extract bundled catalog from published images
        env:
          NOW_ISO: ${{ needs.prepare-catalog.outputs.now_iso }}
          CATALOG_RELEASE_GROUP_ID: ${{ needs.prepare-catalog.outputs.catalog_release_group_id }}
          CATALOG_REVISION: ${{ needs.prepare-catalog.outputs.catalog_revision }}
          CATALOG_DIGEST: ${{ needs.prepare-catalog.outputs.catalog_digest }}
        run: |
          set -euo pipefail
          test -n "$NOW_ISO"
          short_sha="${GITHUB_SHA::12}"
          for image in cycling-coach enduragent; do
            if [ "$image" = cycling-coach ]; then
              reference="${IMAGE_NAME}:main-${short_sha}"
            else
              reference="${ALIAS_IMAGE_NAME}:main-${short_sha}"
            fi
            for platform in linux/amd64 linux/arm64; do
              attempt=1
              delay=4
              while true; do
                if pnpm --silent models:release-pin extract --kind oci-image \
                  --reference "$reference" \
                  --image "$image" \
                  --platform "$platform" \
                  --now-iso "$NOW_ISO" \
                  --expected-release-group-id "$CATALOG_RELEASE_GROUP_ID" \
                  --expected-revision "$CATALOG_REVISION" \
                  --expected-digest "$CATALOG_DIGEST"; then
                  break
                fi
                if [ "$attempt" -ge 5 ]; then
                  exit 1
                fi
                sleep "$delay"
                attempt=$((attempt + 1))
                delay=$((delay * 2))
              done
            done
          done
