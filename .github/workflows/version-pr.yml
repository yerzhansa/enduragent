name: Version PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-pr
  cancel-in-progress: false
  queue: max

jobs:
  version-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Open or update Version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm release-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-coordinator:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Version Packages')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Tag changed npm packages and dispatch protected-main preparation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(git rev-parse HEAD)
          PREVIOUS_COMMIT=$(git rev-parse HEAD^)
          for pkg_json in packages/*/package.json; do
            PRIVATE=$(node -p "require('./$pkg_json').private === true")
            if [ "$PRIVATE" = "true" ]; then
              continue
            fi
            NAME=$(node -p "require('./$pkg_json').name")
            VERSION=$(node -p "require('./$pkg_json').version")
            PREVIOUS_VERSION=$(git show "$PREVIOUS_COMMIT:$pkg_json" | jq -er '.version')
            if [ "$VERSION" = "$PREVIOUS_VERSION" ]; then
              echo "::notice::$NAME remains at $VERSION — skipping npm release"
              continue
            fi
            test "$NAME" = cycling-coach
            printf '%s' "$VERSION" | grep -Eq '^[1-9][0-9]{3}\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])(-[1-9][0-9]*)?$'
            TAG="$NAME@$VERSION"
            TAG_RESPONSE="$RUNNER_TEMP/npm-tag.json"
            TAG_ERROR="$RUNNER_TEMP/npm-tag.error"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$TAG_RESPONSE" 2> "$TAG_ERROR"; then
              TAG_COMMIT=$(jq -er '.object.sha' "$TAG_RESPONSE")
              TAG_TYPE=$(jq -er '.object.type' "$TAG_RESPONSE")
              for depth in $(seq 1 10); do
                test "$TAG_TYPE" = tag || break
                gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_COMMIT" > "$TAG_RESPONSE"
                TAG_COMMIT=$(jq -er '.object.sha' "$TAG_RESPONSE")
                TAG_TYPE=$(jq -er '.object.type' "$TAG_RESPONSE")
              done
              test "$TAG_TYPE" = commit
              if [ "$TAG_COMMIT" != "$RELEASE_COMMIT" ]; then
                echo "::error::Existing tag resolves to a different source commit"
                exit 1
              fi
            elif grep -q 'HTTP 404' "$TAG_ERROR"; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$TAG" -f sha="$RELEASE_COMMIT" >/dev/null
            else
              echo "::error::Release tag lookup failed; refusing to create or dispatch"
              exit 1
            fi
            DISPATCHED=false
            for attempt in $(seq 1 6); do
              if gh workflow run release.yml --ref main -f phase=prepare -f tag="$TAG" \
                -f commit="$RELEASE_COMMIT" -f coordinator_run_id="$GITHUB_RUN_ID" \
                -f coordinator_run_attempt="$GITHUB_RUN_ATTEMPT"; then
                DISPATCHED=true
                break
              fi
              if [ "$attempt" -lt 6 ]; then
                sleep $((attempt * 2))
              fi
            done
            if [ "$DISPATCHED" != "true" ]; then
              echo "::error::Unable to dispatch release.yml from main for $TAG after bounded retries"
              exit 1
            fi
            echo "::notice::Dispatched release.yml from main for $TAG"
          done

  desktop-coordinator:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Version Packages')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Dispatch desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(git rev-parse HEAD)
          PREVIOUS_COMMIT=$(git rev-parse HEAD^)
          DESKTOP_PACKAGE_JSON=apps/desktop/package.json
          DESKTOP_CHANGELOG=apps/desktop/CHANGELOG.md
          DESKTOP_VERSION=$(jq -er '.version' "$DESKTOP_PACKAGE_JSON")
          PREVIOUS_DESKTOP_VERSION=$(git show "$PREVIOUS_COMMIT:$DESKTOP_PACKAGE_JSON" | jq -er '.version')
          if [ "$DESKTOP_VERSION" = "$PREVIOUS_DESKTOP_VERSION" ]; then
            echo "::notice::Desktop remains at $DESKTOP_VERSION — skipping desktop release"
            exit 0
          fi
          DESKTOP_TAG="enduragent-desktop@$DESKTOP_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$DESKTOP_TAG" >/dev/null 2>&1; then
            git fetch --force --no-tags origin "refs/tags/$DESKTOP_TAG:refs/tags/$DESKTOP_TAG"
            DESKTOP_TAG_COMMIT=$(git rev-parse "refs/tags/$DESKTOP_TAG^{commit}")
            if [ "$DESKTOP_TAG_COMMIT" != "$RELEASE_COMMIT" ]; then
              echo "::error::Existing tag $DESKTOP_TAG resolves to $DESKTOP_TAG_COMMIT, expected $RELEASE_COMMIT"
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$DESKTOP_TAG" -f sha="$RELEASE_COMMIT" >/dev/null
            echo "::notice::Created tag $DESKTOP_TAG at $RELEASE_COMMIT"
          fi
          FIRST_HEADING=$(grep -m1 '^## ' "$DESKTOP_CHANGELOG")
          test "$FIRST_HEADING" = "## $DESKTOP_VERSION"
          RELEASE_BODY=$(awk '/^## /{i++} i==1{print} i==2{exit}' "$DESKTOP_CHANGELOG" | tail -n +2)
          test -n "$RELEASE_BODY"
          RELEASE_BODY_SHA256=$(printf '%s' "$RELEASE_BODY" | shasum -a 256 | awk '{print $1}')
          EXISTING_RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$DESKTOP_TAG\")] | first")
          if [ -n "$EXISTING_RELEASE" ] && [ "$EXISTING_RELEASE" != "null" ]; then
            if [ "$(printf '%s' "$EXISTING_RELEASE" | jq -r '.draft')" != 'true' ]; then
              echo "::notice::$DESKTOP_TAG is already published — skipping desktop release dispatch"
              exit 0
            fi
            DRAFT_ID=$(printf '%s' "$EXISTING_RELEASE" | jq -er '.id | tostring')
            EXISTING_BODY_SHA256=$(printf '%s' "$EXISTING_RELEASE" | jq -j '.body' | shasum -a 256 | awk '{print $1}')
            test "$EXISTING_BODY_SHA256" = "$RELEASE_BODY_SHA256"
            echo "::notice::Reusing desktop draft release $DRAFT_ID for $DESKTOP_TAG"
          else
            CREATED_RELEASE=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$DESKTOP_TAG" \
              -f target_commitish="$RELEASE_COMMIT" \
              -f name="Enduragent Desktop $DESKTOP_VERSION" \
              -f body="$RELEASE_BODY" \
              -F draft=true \
              -F prerelease=false \
              -f make_latest=false)
            DRAFT_ID=$(printf '%s' "$CREATED_RELEASE" | jq -er '.id | tostring')
            printf '%s' "$DRAFT_ID" | grep -Eq '^[1-9][0-9]*$'
            echo "::notice::Created desktop draft release $DRAFT_ID for $DESKTOP_TAG"
          fi
          DISPATCHED=false
          for attempt in $(seq 1 6); do
            if gh workflow run desktop-release.yml --ref "$DESKTOP_TAG" \
              -f tag="$DESKTOP_TAG" \
              -f desktop_version="$DESKTOP_VERSION" \
              -f commit="$RELEASE_COMMIT" \
              -f draft_id="$DRAFT_ID" \
              -f draft_body_sha256="$RELEASE_BODY_SHA256"; then
              DISPATCHED=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep $((attempt * 2))
            fi
          done
          if [ "$DISPATCHED" != "true" ]; then
            echo "::error::Unable to dispatch desktop-release.yml for $DESKTOP_TAG after bounded retries"
            echo "Manual dispatch: gh workflow run desktop-release.yml --ref $DESKTOP_TAG -f tag=$DESKTOP_TAG -f desktop_version=$DESKTOP_VERSION -f commit=$RELEASE_COMMIT -f draft_id=$DRAFT_ID -f draft_body_sha256=$RELEASE_BODY_SHA256"
            exit 1
          fi
          echo "::notice::Dispatched desktop release for $DESKTOP_TAG"
