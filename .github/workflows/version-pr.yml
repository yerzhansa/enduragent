name: Version PR

# Opens or updates the changesets "Version Packages" PR whenever a push to
# main contains unconsumed `.changeset/*.md` files. The Version PR is the
# accumulator for pending releases — multiple changesets across multiple
# pushes batch into one PR. Merging the Version PR doesn't ship anything;
# release.yml ships it on tag push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize so concurrent pushes to main don't race each other when both
# trying to update changeset-release/main.
concurrency:
  group: version-pr
  cancel-in-progress: false
  queue: max

jobs:
  version-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # dispatch package or desktop release workflows after a Version-PR merge
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Open or update Version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # `version` consumes .changeset/*.md, bumps package.json, updates
          # CHANGELOG.md, then bump-binaries-to-calver.ts overrides binary
          # versions to today's UTC YYYY.M.D (and rewrites their CHANGELOG headers
          # to match). All run inside pnpm's shell so `&&` chaining works.
          version: pnpm release-version
          # No `publish:` field — publishing happens in release.yml on tag
          # push, not here. This action only manages the Version PR; if no
          # changesets exist, it's a no-op.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch changed package and desktop releases on Version-PR merge
        # Closes the manual gap between "Version PR merged" and "release fires".
        # When the operator merges the changesets-bot PR, package.json versions
        # bump on main but no tag is created. This step tags and dispatches only
        # public packages whose versions changed, then independently tags and
        # dispatches the desktop app when its private SemVer changed.
        #
        # Why dispatch instead of relying on the `push: tags:` trigger in
        # release.yml: GitHub blocks workflow runs from events triggered by
        # GITHUB_TOKEN as an anti-recursion measure, EXCEPT for workflow_dispatch
        # and repository_dispatch (documented exception). Tag pushes from this
        # job use GITHUB_TOKEN, so the tag-push event is silently dropped by
        # release.yml. workflow_dispatch is the supported escape hatch.
        #
        # Gated to push events (skip workflow_dispatch — that path is for
        # operator-driven re-runs of the changesets step itself, not for
        # tagging) and to commits whose message starts with "Version Packages",
        # the changesets/action default PR title that the squash-merge inherits.
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Version Packages')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(git rev-parse HEAD)
          PREVIOUS_COMMIT=$(git rev-parse HEAD^)
          for pkg_json in packages/*/package.json; do
            PRIVATE=$(node -p "require('./$pkg_json').private === true")
            if [ "$PRIVATE" = "true" ]; then
              continue
            fi
            NAME=$(node -p "require('./$pkg_json').name")
            VERSION=$(node -p "require('./$pkg_json').version")
            PREVIOUS_VERSION=$(git show "$PREVIOUS_COMMIT:$pkg_json" | jq -er '.version')
            if [ "$VERSION" = "$PREVIOUS_VERSION" ]; then
              echo "::notice::$NAME remains at $VERSION — skipping npm release"
              continue
            fi
            TAG="$NAME@$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
              TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
              if [ "$TAG_COMMIT" != "$RELEASE_COMMIT" ]; then
                echo "::error::Existing tag $TAG resolves to $TAG_COMMIT, expected $RELEASE_COMMIT"
                exit 1
              fi
              echo "::notice::Existing tag $TAG resolves to the Version Packages commit"
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$TAG" -f sha="$RELEASE_COMMIT" >/dev/null
              echo "::notice::Created tag $TAG at $RELEASE_COMMIT"
            fi
            DISPATCHED=false
            for attempt in $(seq 1 6); do
              if gh workflow run release.yml --ref "$TAG" -f tag="$TAG"; then
                DISPATCHED=true
                break
              fi
              if [ "$attempt" -lt 6 ]; then
                sleep $((attempt * 2))
              fi
            done
            if [ "$DISPATCHED" != "true" ]; then
              echo "::error::Unable to dispatch release.yml on exact tag $TAG after bounded retries"
              exit 1
            fi
            echo "::notice::Dispatched release.yml on exact tag $TAG"
          done

          DESKTOP_PACKAGE_JSON=apps/desktop/package.json
          DESKTOP_CHANGELOG=apps/desktop/CHANGELOG.md
          DESKTOP_VERSION=$(jq -er '.version' "$DESKTOP_PACKAGE_JSON")
          PREVIOUS_DESKTOP_VERSION=$(git show "$PREVIOUS_COMMIT:$DESKTOP_PACKAGE_JSON" | jq -er '.version')
          if [ "$DESKTOP_VERSION" = "$PREVIOUS_DESKTOP_VERSION" ]; then
            echo "::notice::Desktop remains at $DESKTOP_VERSION — skipping desktop release"
            exit 0
          fi
          DESKTOP_TAG="enduragent-desktop@$DESKTOP_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$DESKTOP_TAG" >/dev/null 2>&1; then
            git fetch --force --no-tags origin "refs/tags/$DESKTOP_TAG:refs/tags/$DESKTOP_TAG"
            DESKTOP_TAG_COMMIT=$(git rev-parse "refs/tags/$DESKTOP_TAG^{commit}")
            if [ "$DESKTOP_TAG_COMMIT" != "$RELEASE_COMMIT" ]; then
              echo "::error::Existing tag $DESKTOP_TAG resolves to $DESKTOP_TAG_COMMIT, expected $RELEASE_COMMIT"
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$DESKTOP_TAG" -f sha="$RELEASE_COMMIT" >/dev/null
            echo "::notice::Created tag $DESKTOP_TAG at $RELEASE_COMMIT"
          fi
          FIRST_HEADING=$(grep -m1 '^## ' "$DESKTOP_CHANGELOG")
          test "$FIRST_HEADING" = "## $DESKTOP_VERSION"
          RELEASE_BODY=$(awk '/^## /{i++} i==1{print} i==2{exit}' "$DESKTOP_CHANGELOG" | tail -n +2)
          test -n "$RELEASE_BODY"
          RELEASE_BODY_SHA256=$(printf '%s' "$RELEASE_BODY" | shasum -a 256 | awk '{print $1}')
          EXISTING_RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$DESKTOP_TAG\")] | first")
          if [ -n "$EXISTING_RELEASE" ] && [ "$EXISTING_RELEASE" != "null" ]; then
            if [ "$(printf '%s' "$EXISTING_RELEASE" | jq -r '.draft')" != 'true' ]; then
              echo "::notice::$DESKTOP_TAG is already published — skipping desktop release dispatch"
              exit 0
            fi
            DRAFT_ID=$(printf '%s' "$EXISTING_RELEASE" | jq -er '.id | tostring')
            EXISTING_BODY_SHA256=$(printf '%s' "$EXISTING_RELEASE" | jq -j '.body' | shasum -a 256 | awk '{print $1}')
            test "$EXISTING_BODY_SHA256" = "$RELEASE_BODY_SHA256"
            echo "::notice::Reusing desktop draft release $DRAFT_ID for $DESKTOP_TAG"
          else
            gh release create "$DESKTOP_TAG" \
              --draft \
              --latest=false \
              --target "$RELEASE_COMMIT" \
              --title "Enduragent Desktop $DESKTOP_VERSION" \
              --notes "$RELEASE_BODY"
            DRAFT_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"$DESKTOP_TAG\")] | first | .id | tostring")
            printf '%s' "$DRAFT_ID" | grep -Eq '^[1-9][0-9]*$'
            echo "::notice::Created desktop draft release $DRAFT_ID for $DESKTOP_TAG"
          fi
          DISPATCHED=false
          for attempt in $(seq 1 6); do
            if gh workflow run desktop-release.yml --ref "$DESKTOP_TAG" \
              -f tag="$DESKTOP_TAG" \
              -f desktop_version="$DESKTOP_VERSION" \
              -f commit="$RELEASE_COMMIT" \
              -f draft_id="$DRAFT_ID" \
              -f draft_body_sha256="$RELEASE_BODY_SHA256"; then
              DISPATCHED=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep $((attempt * 2))
            fi
          done
          if [ "$DISPATCHED" != "true" ]; then
            echo "::error::Unable to dispatch desktop-release.yml for $DESKTOP_TAG after bounded retries"
            echo "Manual dispatch: gh workflow run desktop-release.yml --ref $DESKTOP_TAG -f tag=$DESKTOP_TAG -f desktop_version=$DESKTOP_VERSION -f commit=$RELEASE_COMMIT -f draft_id=$DRAFT_ID -f draft_body_sha256=$RELEASE_BODY_SHA256"
            exit 1
          fi
          echo "::notice::Dispatched desktop release for $DESKTOP_TAG"
