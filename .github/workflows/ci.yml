name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # Reads `packageManager` from root package.json (corepack-style pin).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Coverage (measure-only, per-directory)
        run: pnpm test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
      - name: Changeset presence (warn-only)
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          subject="$(git log -1 --format=%s)"
          if printf '%s' "$subject" | grep -qE '^(chore|ci)(\(|:)'; then
            echo "::notice::chore/ci commit — changeset not expected, skipping check."
            exit 0
          fi
          if git diff --name-only "$base"...HEAD -- '.changeset/*.md' | grep -q .; then
            echo "::notice::Changeset present."
          else
            echo "::warning::No changeset found for this PR. Behavioral/user-facing changes should ship a .changeset/*.md (see .changeset/README.md). chore:/ci: PRs are exempt."
          fi

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Pack and smoke cycling-coach
        run: |
          set -euo pipefail
          PACKAGE=cycling-coach
          PACK_DIR="/tmp/smoke-pack-$PACKAGE"
          mkdir -p "$PACK_DIR"
          pnpm --dir "packages/$PACKAGE" pack --pack-destination "$PACK_DIR"
          TARBALL=$(find "$PACK_DIR" -maxdepth 1 -name '*.tgz' -print -quit)
          pnpm check:published-package -- "$TARBALL"
      - name: Smoke filtered production deploy
        run: |
          set -euo pipefail
          DEPLOY_DIR="/tmp/cycling-coach-deploy"
          pnpm --filter cycling-coach --prod --legacy deploy "$DEPLOY_DIR"
          node "$DEPLOY_DIR/dist/index.js" --help
          VERSION=$(node -p "require('./packages/cycling-coach/package.json').version")
          test "$(node "$DEPLOY_DIR/dist/index.js" version)" = "cycling-coach v$VERSION"

  smoke-node-22:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Verify packed cycling-coach on Node 22
        run: |
          set -euo pipefail
          PACK_DIR="/tmp/smoke-pack-cycling-coach-node-22"
          mkdir -p "$PACK_DIR"
          pnpm --dir packages/cycling-coach pack --pack-destination "$PACK_DIR"
          TARBALL=$(find "$PACK_DIR" -maxdepth 1 -name '*.tgz' -print -quit)
          pnpm check:published-package -- "$TARBALL"

  secrets-macos:
    runs-on: macos-latest
    env:
      CI: macos
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # Reads `packageManager` from root package.json (corepack-style pin).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @enduragent/core exec vitest run tests/secrets
