name: CI

on:
  push:
    branches: [main, desktop]
  pull_request:
    branches: [main, desktop, "epic/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-scope:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/ui-verification/desktop-scope.ts

  check:
    needs: desktop-scope
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      smoke: ${{ steps.package_smoke.outputs.result }}
    steps:
      - name: Require Desktop scope detection
        if: needs.desktop-scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # Reads the exact `packageManager` pin from root package.json.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Test workspace on Linux
        run: |
          pnpm exec vitest run --shard=1/2
          pnpm exec vitest run --shard=2/2
      - id: package_smoke
        name: Pack and smoke cycling-coach
        run: |
          set -euo pipefail
          PACKAGE=cycling-coach
          PACK_DIR="/tmp/smoke-pack-$PACKAGE"
          mkdir -p "$PACK_DIR"
          pnpm --dir "packages/$PACKAGE" pack --pack-destination "$PACK_DIR"
          TARBALL=$(find "$PACK_DIR" -maxdepth 1 -name '*.tgz' -print -quit)
          pnpm check:published-package -- "$TARBALL"
          mkdir -p "/tmp/smoke-consumer-$PACKAGE"
          cd "/tmp/smoke-consumer-$PACKAGE"
          npm init -y > /dev/null
          npm install "$TARBALL" --ignore-scripts
          timeout 30 node "node_modules/$PACKAGE/dist/index.js" --help
          printf 'result=success\n' >> "$GITHUB_OUTPUT"
      - name: Changeset presence (warn-only)
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          subject="$(git log -1 --format=%s)"
          if printf '%s' "$subject" | grep -qE '^(chore|ci)(\(|:)'; then
            echo "::notice::chore/ci commit — changeset not expected, skipping check."
            exit 0
          fi
          if git diff --name-only "$base"...HEAD -- '.changeset/*.md' | grep -q .; then
            echo "::notice::Changeset present."
          else
            echo "::warning::No changeset found for this PR. Behavioral/user-facing changes should ship a .changeset/*.md (see .changeset/README.md). chore:/ci: PRs are exempt."
          fi

  test:
    needs: check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require consolidated Linux checks
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          printf 'check=%s\n' "$CHECK_RESULT"
          test "$CHECK_RESULT" = success

  smoke:
    needs: check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require package smoke evidence
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          SMOKE_RESULT: ${{ needs.check.outputs.smoke }}
        run: |
          printf 'check=%s\nsmoke=%s\n' "$CHECK_RESULT" "$SMOKE_RESULT"
          test "$CHECK_RESULT" = success
          test "$SMOKE_RESULT" = success

  secrets-macos:
    needs: [desktop-scope, desktop-packaged-native]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require scoped macOS Keychain test
        env:
          SCOPE_RESULT: ${{ needs.desktop-scope.result }}
          NATIVE_SCOPE: ${{ needs.desktop-scope.outputs.native }}
          NATIVE_RESULT: ${{ needs.desktop-packaged-native.result }}
        run: |
          printf 'scope=%s\nnative=%s\nvalidation=%s\n' "$SCOPE_RESULT" "$NATIVE_SCOPE" "$NATIVE_RESULT"
          test "$SCOPE_RESULT" = success
          if [ "$NATIVE_SCOPE" = true ]; then
            test "$NATIVE_RESULT" = success
          else
            test "$NATIVE_RESULT" = skipped
          fi

  desktop-packaged-self-test:
    needs: [desktop-scope, desktop-packaged-native]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require scoped Desktop package validation
        env:
          SCOPE_RESULT: ${{ needs.desktop-scope.result }}
          NATIVE_SCOPE: ${{ needs.desktop-scope.outputs.native }}
          NATIVE_RESULT: ${{ needs.desktop-packaged-native.result }}
        run: |
          printf 'scope=%s\nnative=%s\nvalidation=%s\n' "$SCOPE_RESULT" "$NATIVE_SCOPE" "$NATIVE_RESULT"
          test "$SCOPE_RESULT" = success
          if [ "$NATIVE_SCOPE" = true ]; then
            test "$NATIVE_RESULT" = success
          else
            test "$NATIVE_RESULT" = skipped
          fi

  desktop-packaged-native:
    needs: desktop-scope
    if: needs.desktop-scope.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CI: macos
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: test "$(uname -m)" = "arm64"
      - run: pnpm install --frozen-lockfile
      - name: Build Desktop dependencies
        run: pnpm --filter "@enduragent/desktop^..." build
      - name: Prepare Desktop package
        run: pnpm --filter @enduragent/desktop package:dir
      - name: Test Desktop integrations on macOS
        run: pnpm --filter @enduragent/desktop exec vitest run tests/onboarding-first-run.integration.test.ts tests/spend-meter.integration.test.ts tests/chat-panels.integration.test.ts --maxWorkers=1
      - name: Test Desktop E2E on macOS
        run: pnpm --filter @enduragent/desktop test:e2e
      - name: Verify native application UI states
        run: pnpm check:ui-states
      - name: Upload Desktop E2E artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-macos-artifacts
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          if-no-files-found: warn
      - name: Test prepared Desktop package
        run: pnpm --filter @enduragent/desktop test:packaged-self-test --prepared-package
      - run: pnpm --filter @enduragent/desktop verify:package-layout
      - run: pnpm --filter @enduragent/desktop run smoke:security -- --mode=packaged --output=/tmp/desktop-security-packaged
      - run: pnpm --filter @enduragent/desktop package:telegram-acceptance:prepared
      - run: pnpm --filter @enduragent/desktop test:telegram-packaged
        env:
          ENDURAGENT_DISPOSABLE_SAFE_STORAGE_CONTEXT: "1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify Node 22 compatibility runtime
        run: |
          node_version="$(node -p 'process.version')"
          printf 'Test runtime: %s\n' "$node_version"
          case "$node_version" in
            v22.*) ;;
            *) exit 1 ;;
          esac
      - name: Test macOS Keychain secrets
        working-directory: packages/core
        run: node ../../node_modules/vitest/vitest.mjs run tests/secrets

  windows-desktop-package:
    needs: desktop-scope
    if: needs.desktop-scope.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: windows
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Desktop dependencies
        run: pnpm --filter "@enduragent/desktop^..." build
      - name: Build and verify unsigned x64 NSIS package
        run: pnpm --filter @enduragent/desktop package:win
      - name: Install, test, and uninstall unsigned x64 NSIS package
        run: pnpm --filter @enduragent/desktop test:windows-installed-self-test --github-hosted --signature-policy unsigned-private
      - name: Build unsigned x64 Microsoft Store package
        env:
          ENDURAGENT_STORE_IDENTITY_NAME: 00000Synthetic.EnduragentCi
          ENDURAGENT_STORE_PUBLISHER: CN=00000000-0000-0000-0000-000000000000
          ENDURAGENT_STORE_PUBLISHER_DISPLAY_NAME: Enduragent CI
        run: pnpm --filter @enduragent/desktop package:win-store
      - name: Check Microsoft Store package manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem -LiteralPath apps/desktop/dist/windows-store -Filter *.appx)
          if ($packages.Count -ne 1) { throw 'expected exactly one Store package' }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            if ($zip.Entries.FullName -contains 'AppxSignature.p7x') { throw 'Store package must be unsigned' }
            $reader = [System.IO.StreamReader]::new($zip.GetEntry('AppxManifest.xml').Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }
          $version = (Get-Content -Raw apps/desktop/package.json | ConvertFrom-Json).version
          $identity = $manifest.DocumentElement['Identity']
          if ($identity.GetAttribute('Name') -cne '00000Synthetic.EnduragentCi') { throw 'Store identity name mismatch' }
          if ($identity.GetAttribute('Publisher') -cne 'CN=00000000-0000-0000-0000-000000000000') { throw 'Store publisher mismatch' }
          if ($identity.GetAttribute('Version') -cne "$version.0") { throw 'Store package version mismatch' }
          if ($identity.GetAttribute('ProcessorArchitecture') -cne 'x64') { throw 'Store package must be x64' }
          if ($manifest.DocumentElement['Properties']['PublisherDisplayName'].InnerText -cne 'Enduragent CI') { throw 'Store publisher display name mismatch' }
          $languages = @($manifest.DocumentElement['Resources'].ChildNodes | Where-Object { $_.NodeType -eq 'Element' } | ForEach-Object { $_.GetAttribute('Language') })
          if (($languages -join ',') -cne 'en-US') { throw 'Store package must declare only en-US' }
          $family = $manifest.DocumentElement['Dependencies']['TargetDeviceFamily']
          if ($family.GetAttribute('Name') -cne 'Windows.Desktop' -or $family.GetAttribute('MinVersion') -cne '10.0.22000.0' -or $family.GetAttribute('MaxVersionTested') -cne '10.0.26100.0') { throw 'Store package device family mismatch' }
          $applications = @($manifest.DocumentElement['Applications'].ChildNodes | Where-Object { $_.NodeType -eq 'Element' })
          if ($applications.Count -ne 1 -or $applications[0].GetAttribute('Id') -cne 'Enduragent') { throw 'Store application id mismatch' }
          $capabilities = @($manifest.DocumentElement['Capabilities'].ChildNodes | Where-Object { $_.NodeType -eq 'Element' } | ForEach-Object { $_.GetAttribute('Name') })
          if (($capabilities -join ',') -cne 'runFullTrust') { throw 'Store package must declare only runFullTrust' }
          if ($manifest.OuterXml -match 'windows\.startupTask') { throw 'Store package must not declare a startup task' }
          Write-Output "Store package manifest checked: $($packages[0].Name)"
