name: Desktop Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Frozen desktop SemVer already published for macOS
        required: true
        type: string
      dry_run:
        description: Verify only; never add the evidence asset
        type: boolean
        default: true
      authenticode:
        description: Authenticode verification mode
        type: choice
        options:
          - pending-w19
          - verify
        default: pending-w19
      publisher_dn:
        description: Exact Authenticode publisher distinguished name
        required: false
        type: string
        default: ""

permissions: { contents: read }

concurrency:
  group: desktop-windows-release
  cancel-in-progress: false

jobs:
  verify-windows-envelope:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions: { contents: write }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          trap 'echo "::error::Failed to resolve Windows release"' ERR
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo '::error::Desktop version must be stable SemVer'
            exit 1
          fi
          if ! RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/enduragent-desktop@$VERSION"); then
            echo '::error::Desktop release does not exist'
            exit 1
          fi
          if [ "$(printf '%s' "$RELEASE" | jq -r '.draft')" != 'false' ] || \
             [ "$(printf '%s' "$RELEASE" | jq -r '.prerelease')" != 'false' ]; then
            echo '::error::Desktop release must be published and not prerelease'
            exit 1
          fi
          EXPECTED=$(printf '%s\n' \
            "Enduragent-$VERSION-x64.exe" \
            "Enduragent-$VERSION-x64.exe.blockmap" \
            latest.yml | LC_ALL=C sort)
          ACTUAL=$(printf '%s' "$RELEASE" | jq -r --arg version "$VERSION" \
            '.assets[].name | select(. == "Enduragent-\($version)-x64.exe" or . == "Enduragent-\($version)-x64.exe.blockmap" or . == "latest.yml")' | LC_ALL=C sort)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo '::error::Windows release assets are incomplete'
            exit 1
          fi
          LATEST_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" | jq -er '.tag_name')
          if [ "$LATEST_TAG" != "enduragent-desktop@$VERSION" ]; then
            echo '::error::Desktop release is not the latest release'
            exit 1
          fi
          RELEASE_ID=$(printf '%s' "$RELEASE" | jq -er '.id')
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          WINDOWS_ASSETS=$(printf '%s' "$RELEASE" | jq -ceS --arg version "$VERSION" '
            [.assets[]
              | select(.name == "Enduragent-\($version)-x64.exe" or .name == "Enduragent-\($version)-x64.exe.blockmap" or .name == "latest.yml")
              | {id, name, state, size, digest}]
            | sort_by(.name)
            | if length == 3 and all(.[];
                (.id | (type == "number" and . > 0)) and
                .state == "uploaded" and
                (.size | (type == "number" and . > 0)) and
                (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")))
              then . else error("Windows release asset identity is invalid") end')
          echo "windows_assets=$WINDOWS_ASSETS" >> "$GITHUB_OUTPUT"
          REF=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/enduragent-desktop@$VERSION")
          OBJECT_TYPE=$(printf '%s' "$REF" | jq -er '.object.type')
          OBJECT_SHA=$(printf '%s' "$REF" | jq -er '.object.sha')
          if [ "$OBJECT_TYPE" = 'tag' ]; then
            OBJECT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$OBJECT_SHA" | jq -er 'select(.object.type == "commit") | .object.sha')
          elif [ "$OBJECT_TYPE" != 'commit' ]; then
            echo '::error::Desktop release tag is unresolvable'
            exit 1
          fi
          if ! printf '%s' "$OBJECT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo '::error::Desktop release tag is unresolvable'
            exit 1
          fi
          echo "commit=$OBJECT_SHA" >> "$GITHUB_OUTPUT"
      - name: Refuse to mark assets while Authenticode is pending
        if: ${{ inputs.dry_run == false && inputs.authenticode != 'verify' }}
        run: |
          echo '::error::Authenticode verification is not enabled; refusing to record verification evidence'
          exit 1
      - name: Download Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          WORK="$(cygpath -u "$RUNNER_TEMP")/windows-release"
          mkdir -p "$WORK"
          gh release download "enduragent-desktop@$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$WORK" \
            --pattern "Enduragent-$VERSION-x64.exe" \
            --pattern "Enduragent-$VERSION-x64.exe.blockmap" \
            --pattern latest.yml
          test "$(ls -1 "$WORK" | LC_ALL=C sort)" = "$(printf '%s\n' "Enduragent-$VERSION-x64.exe" "Enduragent-$VERSION-x64.exe.blockmap" latest.yml | LC_ALL=C sort)"
      - name: Verify Windows release envelope
        id: verify
        env:
          VERSION: ${{ inputs.version }}
          AUTHENTICODE: ${{ inputs.authenticode }}
          PUBLISHER_DN: ${{ inputs.publisher_dn }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          WORK="$(cygpath -u "$RUNNER_TEMP")/windows-release"
          WORK_WIN="$(cygpath -w "$WORK")"
          if [ "$AUTHENTICODE" = 'verify' ]; then
            if [ -z "$PUBLISHER_DN" ] || [ "$PUBLISHER_DN" = 'CN=ENDURAGENT PUBLISHER DN PLACEHOLDER, O=PLACEHOLDER' ]; then
              echo '::error::publisher_dn is required'
              exit 1
            fi
            node apps/desktop/scripts/verify-windows-release.mjs "$WORK_WIN" --version "$VERSION" --commit "$COMMIT" --authenticode verify --publisher-dn "$PUBLISHER_DN" | tee "$WORK/../verify.out"
          else
            node apps/desktop/scripts/verify-windows-release.mjs "$WORK_WIN" --version "$VERSION" --commit "$COMMIT" --authenticode pending-w19 | tee "$WORK/../verify.out"
          fi
          VERIFIED_FILES=$(sed -n 's/^Windows release evidence files //p' "$WORK/../verify.out" | tail -n 1)
          printf '%s' "$VERIFIED_FILES" | jq -e --arg version "$VERSION" '
            length == 3 and
            ([.[].name] | sort) == (["Enduragent-\($version)-x64.exe", "Enduragent-\($version)-x64.exe.blockmap", "latest.yml"] | sort) and
            all(.[];
              (keys | sort) == (["name", "sha256", "size"] | sort) and
              (.size | (type == "number" and . > 0)) and
              (.sha256 | type == "string" and test("^[0-9a-f]{64}$")))' > /dev/null
          echo "verified_files=$VERIFIED_FILES" >> "$GITHUB_OUTPUT"
          echo "authenticode=$AUTHENTICODE" >> "$GITHUB_OUTPUT"
      - name: Record Windows verification evidence
        if: ${{ inputs.dry_run == false && inputs.authenticode == 'verify' && steps.verify.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_ASSETS: ${{ steps.release.outputs.windows_assets }}
          PUBLISHER_DN: ${{ inputs.publisher_dn }}
          VERIFIED_FILES: ${{ steps.verify.outputs.verified_files }}
        run: |
          set -euo pipefail
          TEMP="$(cygpath -u "$RUNNER_TEMP")/windows-evidence"
          mkdir -p "$TEMP"
          TAG="enduragent-desktop@$VERSION"
          EVIDENCE="Enduragent-$VERSION-x64-verification.json"
          PUBLISHER_SHA256=$(printf '%s' "$PUBLISHER_DN" | sha256sum | awk '{print $1}')
          FILES=$(jq -cenS --argjson verified "$VERIFIED_FILES" --argjson release "$RELEASE_ASSETS" '
            [$verified[] as $verifiedFile
              | $release[]
              | select(.name == $verifiedFile.name)
              | select(.state == "uploaded")
              | select(.size == $verifiedFile.size)
              | select(.digest == ("sha256:" + $verifiedFile.sha256))
              | {id, name, size, sha256: $verifiedFile.sha256}]
            | sort_by(.name)
            | if length == 3 then . else error("Verified files do not match the resolved release assets") end')
          INSTALLER_SHA256=$(printf '%s' "$FILES" | jq -er --arg name "Enduragent-$VERSION-x64.exe" '.[] | select(.name == $name) | .sha256')
          jq -nS \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            --arg commit "$COMMIT" \
            --arg installerSha256 "$INSTALLER_SHA256" \
            --arg publisherDnSha256 "$PUBLISHER_SHA256" \
            --argjson files "$FILES" \
            '{schemaVersion: 2, tag: $tag, version: $version, commit: $commit, arch: "x64", authenticode: "verified", installerSha256: $installerSha256, publisherDnSha256: $publisherDnSha256, files: $files}' \
            > "$TEMP/$EVIDENCE"
          node apps/desktop/scripts/upload-windows-verification-evidence.mjs \
            --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --commit "$COMMIT" \
            --evidence "$TEMP/$EVIDENCE"
      - name: Dry run summary
        if: ${{ inputs.dry_run == true }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "::notice::dry_run=true; release enduragent-desktop@$VERSION was verified; no evidence asset was recorded"
